[project]
name = "orix"
version = "3.1.0"
description = "Orix X: Universal Project Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "questionary>=1.10.0",
    "jinja2>=3.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "playwright>=1.35.0; extra == 'web'",
    "tree_sitter>=0.2.0; extra == 'treesitter'",
    "tomli_w>=1.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
orix = "orix.core.cli:cli"

[tool.setuptools.packages.find]
include = ["orix*"]
exclude = ["builds*", "tests*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
